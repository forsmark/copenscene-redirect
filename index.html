<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0e0e10" />
    <title>CopenScene</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      copenscene.rocks forwards to where CopenScene is served. The path, query
      and fragment come along, so a mailed link such as
      copenscene.rocks/sign-in?secret=... opens the same page there.

      This page is also 404.html, which is how GitHub Pages answers every path
      it has no file for. The two files are the same; test/page.test.mjs checks.

      Before it forwards, the page reads /status.json, then asks the site's
      /api/health. Maintenance on shows the maintenance page; a health check that
      does not answer 200 within 3 seconds shows the downtime page. The
      `site-availability` spec in forsmark/copenscene says what each does.

      The meta refresh is for a browser without script. It cannot carry the
      path, so it goes to the front page. It sits in <noscript>, so it does not
      forward a browser that is still checking.
    -->
    <noscript><meta http-equiv="refresh" content="1; url=https://devbox.tailf4d52f.ts.net/" /></noscript>
    <style>
      /* The site's identity, from `visual-identity`: ground, ink, accent, square
         corners, and Archivo, condensed caps for the wordmark.
         The wordmark is the icon's ticket as its C, then OPENSCENE, then .ROCKS. The font is a
         copy here, since the site may be down. Text shows only with a message,
         so a forward loads no font. */
      @font-face {
        font-family: 'Archivo';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url('/fonts/archivo-latin.woff2') format('woff2-variations');
      }
      :root {
        --ground: #0e0e10;
        --ink: #fff2df;
        --accent: #ff8a00;
        --muted: rgb(255 242 223 / 0.62);
        color-scheme: dark;
      }
      html {
        background: var(--ground);
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--ground);
        color: var(--ink);
        font-family: 'Archivo', system-ui, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.45;
        font-variation-settings: 'wdth' 100;
        -webkit-font-smoothing: antialiased;
      }
      main {
        box-sizing: border-box;
        max-width: 36rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      .wordmark {
        display: inline-block;
        margin: 0 0 3rem;
        font-size: 1.5rem;
        font-variation-settings: 'wdth' 68, 'wght' 900;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent);
        text-decoration: none;
        white-space: nowrap;
      }
      /* The icon's ticket as the wordmark's C, drawn from the shapes of icon.svg in
         forsmark/copenscene, and set as the site's bar sets it. */
      .wordmark-ticket {
        display: inline-block;
        height: 1.1em;
        width: 1.364em;
        margin-right: 0.08em;
        vertical-align: -0.18em;
      }
      .wordmark-domain {
        font-size: 0.6em;
        letter-spacing: 0.04em;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
        line-height: 1.1;
        font-weight: normal;
        font-variation-settings: 'wdth' 70, 'wght' 800;
        letter-spacing: 0.01em;
        overflow-wrap: break-word;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 1.125rem;
        color: var(--muted);
      }
      button {
        min-height: 44px;
        padding: 0 1.25rem;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 1rem;
        font-variation-settings: 'wdth' 100, 'wght' 600;
        cursor: pointer;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 1.25rem;
      }
      .anyway {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: var(--ink);
        text-underline-offset: 4px;
      }
      .anyway:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }
      button:disabled {
        color: var(--muted);
        border-color: var(--muted);
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="notice" hidden>
        <p class="wordmark" aria-label="CopenScene" role="img"><svg class="wordmark-ticket" viewBox="28 40 124 100" aria-hidden="true" focusable="false"><polygon points="46,40 152,40 152,122 134,140 28,140 28,58" fill="#FF8A00"/> <line x1="122" y1="47" x2="122" y2="134" stroke="#0E0E10" stroke-width="4" stroke-dasharray="4 5"/> <path fill="#0E0E10" d="M76.38 123.1Q68.1 123.1 62.8 119.58Q57.5 116.05 54.97 108.78Q52.45 101.5 52.45 90.27Q52.45 73.54 58.57 65.53Q64.68 57.52 76.69 57.52Q83.49 57.52 88.21 60.22Q92.94 62.91 95.43 68.91Q97.93 74.9 97.93 84.74H81.22Q81.22 80.67 80.83 77.85Q80.43 75.03 79.27 73.59Q78.11 72.16 75.9 72.16Q73.52 72.16 72.25 73.54Q70.98 74.91 70.56 77.6Q70.14 80.29 70.14 84.31V96.39Q70.14 100.49 70.61 103.18Q71.08 105.87 72.33 107.21Q73.59 108.54 75.95 108.54Q78.22 108.54 79.45 107.16Q80.67 105.78 81.15 103.05Q81.64 100.31 81.64 96.33H97.93Q97.93 105.83 95.46 111.73Q93 117.64 88.2 120.37Q83.41 123.1 76.38 123.1Z"/></svg><span>openScene</span><span class="wordmark-domain">.rocks</span></p>
        <section id="downtime" hidden>
          <h1>CopenScene isn’t answering right now.</h1>
          <p>Check again in a few minutes.</p>
          <div class="actions">
            <button id="retry" type="button">Check again</button>
            <!-- A browser can refuse the check while the site is up, as Chromium does on
                 the tailnet (copenscene#814), so the reader can always go on. -->
            <a id="anyway" class="anyway" href="https://devbox.tailf4d52f.ts.net/">Open CopenScene anyway</a>
          </div>
        </section>
        <section id="maintenance" hidden>
          <h1>CopenScene is down for maintenance.</h1>
          <p>Back soon, after a quick changeover.</p>
        </section>
      </div>
      <noscript>
        <p><a class="wordmark" aria-label="CopenScene" href="https://devbox.tailf4d52f.ts.net/"><svg class="wordmark-ticket" viewBox="28 40 124 100" aria-hidden="true" focusable="false"><polygon points="46,40 152,40 152,122 134,140 28,140 28,58" fill="#FF8A00"/> <line x1="122" y1="47" x2="122" y2="134" stroke="#0E0E10" stroke-width="4" stroke-dasharray="4 5"/> <path fill="#0E0E10" d="M76.38 123.1Q68.1 123.1 62.8 119.58Q57.5 116.05 54.97 108.78Q52.45 101.5 52.45 90.27Q52.45 73.54 58.57 65.53Q64.68 57.52 76.69 57.52Q83.49 57.52 88.21 60.22Q92.94 62.91 95.43 68.91Q97.93 74.9 97.93 84.74H81.22Q81.22 80.67 80.83 77.85Q80.43 75.03 79.27 73.59Q78.11 72.16 75.9 72.16Q73.52 72.16 72.25 73.54Q70.98 74.91 70.56 77.6Q70.14 80.29 70.14 84.31V96.39Q70.14 100.49 70.61 103.18Q71.08 105.87 72.33 107.21Q73.59 108.54 75.95 108.54Q78.22 108.54 79.45 107.16Q80.67 105.78 81.15 103.05Q81.64 100.31 81.64 96.33H97.93Q97.93 105.83 95.46 111.73Q93 117.64 88.2 120.37Q83.41 123.1 76.38 123.1Z"/></svg><span>openScene</span><span class="wordmark-domain">.rocks</span></a></p>
      </noscript>
    </main>
    <script>
      const SITE = 'https://devbox.tailf4d52f.ts.net';
      const WAIT_MS = 3000;
      // Read once, so a retry forwards to the address the reader first asked for.
      const target = SITE + location.pathname + location.search + location.hash;
      document.getElementById('anyway').href = target;

      async function within(url) {
        const abort = new AbortController();
        const timer = setTimeout(() => abort.abort(), WAIT_MS);
        try {
          return await fetch(url, { cache: 'no-store', signal: abort.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      // A status file that is missing or broken is off: it must never hide a site that is up.
      async function maintenance() {
        try {
          const answer = await within('/status.json');
          return answer.ok && (await answer.json()).maintenance === true;
        } catch {
          return false;
        }
      }

      async function up() {
        try {
          return (await within(SITE + '/api/health')).status === 200;
        } catch {
          return false;
        }
      }

      function show(state) {
        document.getElementById('notice').hidden = false;
        document.getElementById('downtime').hidden = state !== 'downtime';
        document.getElementById('maintenance').hidden = state !== 'maintenance';
        document.body.dataset.state = state;
      }

      async function check() {
        if (await maintenance()) return show('maintenance');
        if (await up()) return location.replace(target);
        show('downtime');
      }

      const retry = document.getElementById('retry');
      retry.addEventListener('click', async () => {
        retry.disabled = true;
        retry.textContent = 'Checking…';
        await check();
        retry.disabled = false;
        retry.textContent = 'Check again';
      });

      check();
    </script>
  </body>
</html>
